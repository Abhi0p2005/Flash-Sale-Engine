services:
  - type: web
    name: flashengine-api
    runtime: docker
    repo: https://github.com/Abhi0p2005/Flash-Sale-Engine
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flashengine-db
          property: internalConnectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: flashengine-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: flashengine-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flashengine-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RABBITMQ_ENABLED
        value: "false"

  - type: keyvalue
    name: flashengine-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: flashengine-db
    databaseName: flashengine
    plan: free

spring.application.name=flashEngine

#Database Configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:flashengine}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:Abhi@1289}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Redis Configuration
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

#Spring Session — store refresh tokens in Redis
spring.session.store-type=redis

#Instruct spring boot to wait active requests to complete before shutting down
server.shutdown=graceful

#time limit allowed for active requests to complete before shutting down
spring.lifecycle.timeout-per-shutdown-phase=30s

# RabbitMQ Configuration (disabled by default — enable by setting RABBITMQ_HOST)
rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.dynamic=false

#Disable default requeueing
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Enable retry state management inside the listener container
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms

# JWT Configuration
jwt.access-secret=${JWT_ACCESS_SECRET:flashEngineAccessSecretKey2026VeryLongSecureStringForHS512}
jwt.refresh-secret=${JWT_REFRESH_SECRET:flashEngineRefreshSecretKey2026EvenLongerMoreSecureStringForHS512}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

#Server
server.port=${PORT:8080}